<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="flowL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A84B;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#D4A84B;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="flowR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#C49A3C;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#C49A3C;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#FFF8F0"/>

  <g transform="translate(100,88)">
    <!-- Left incoming book -->
    <rect x="-50" y="-30" width="28" height="60" rx="4" fill="url(#flowL)"/>
    <rect x="-50" y="-30" width="28" height="60" rx="4" fill="none" stroke="#D4A84B" stroke-width="1.2" opacity="0.4"/>

    <!-- Right incoming book -->
    <rect x="22" y="-30" width="28" height="60" rx="4" fill="url(#flowR)"/>
    <rect x="22" y="-30" width="28" height="60" rx="4" fill="none" stroke="#C49A3C" stroke-width="1.2" opacity="0.4"/>

    <!-- Center book - solid, warm -->
    <rect x="-14" y="-32" width="28" height="64" rx="4" fill="#8B5E3C"/>
    <rect x="-14" y="-32" width="28" height="64" rx="4" fill="none" stroke="#6B3A1F" stroke-width="1.5"/>
    <!-- Spine detail -->
    <line x1="-9" y1="-29" x2="-9" y2="29" stroke="#A0724A" stroke-width="1.5" opacity="0.5"/>
    <line x1="9" y1="-29" x2="9" y2="29" stroke="#5C2E15" stroke-width="1" opacity="0.4"/>
    <!-- Page edges -->
    <line x1="-11" y1="-28" x2="11" y2="-28" stroke="#C49A6C" stroke-width="1" opacity="0.3"/>
    <line x1="-11" y1="-22" x2="11" y2="-22" stroke="#C49A6C" stroke-width="0.8" opacity="0.2"/>
    <line x1="-11" y1="22" x2="11" y2="22" stroke="#C49A6C" stroke-width="0.8" opacity="0.2"/>
    <line x1="-11" y1="28" x2="11" y2="28" stroke="#C49A6C" stroke-width="1" opacity="0.3"/>

    <!-- Flow connector: curved line showing exchange direction -->
    <path d="M-38,0 Q0,-15 38,0" fill="none" stroke="#C49A3C" stroke-width="1.2" opacity="0.35"/>
    <!-- Tiny arrowheads on flow line -->
    <polygon points="-24,-4 -20,-6 -20,-2" fill="#C49A3C" opacity="0.35"/>
    <polygon points="24,-4 20,-6 20,-2" fill="#C49A3C" opacity="0.35"/>
  </g>

  <text x="100" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#5C3317" letter-spacing="10">书易</text>
</svg>
