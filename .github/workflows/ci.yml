name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端 lint + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    name: 后端依赖与语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: 语法检查
        working-directory: server
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

  api-smoke:
    name: 接口冒烟测试（MySQL 8）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: shuyi_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 安装后端依赖
        working-directory: server
        run: npm ci
      - name: 初始化测试库
        working-directory: server
        run: npm run init-db
      - name: 集成测试（Vitest + Supertest）
        working-directory: server
        run: npm test
      - name: 启动后端并跑冒烟测试
        working-directory: server
        run: |
          node index.js > /tmp/shuyi-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "后端已就绪"
              break
            fi
            sleep 1
          done
          cat /tmp/shuyi-server.log
          SMOKE_BASE=http://127.0.0.1:3000 npm run smoke
